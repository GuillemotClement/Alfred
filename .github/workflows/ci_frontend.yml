name: CI Frontend

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./front

    steps:
      # récupération du code
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # installation pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: front/package.json

      # Installation Node
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      # Installation deps
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vérification du formatage
      - name: Check formatting
        run: pnpm format:check

      # Analyse statique
      - name:
        run: pnpm lint

      # Compilation Angular
      - name: Build
        run: pnpm build
