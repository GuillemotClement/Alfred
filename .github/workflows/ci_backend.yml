name: CI Backend

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./alfredapi

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        # contient les paramètres founis a l'action
        with:
          # distribution JDK (outil pour compiler et executer Java)
          distribution: temurin
          # version de java a installer
          java-version: ${{ env.JAVA_VERSION }}
          # active le cache maven
          cache: maven
          # indique le fichier utilisé pour calculer la clé du cache
          cache-dependency-path: alfredapi/pom.xml

      - name: Check Java style
        # lance le waven wrapper avec bash
        # --batch-mode: adapte maven a une execution automatique
        run: bash ./mvnw --batch-mode checkstyle:check

      - name: Build and test
        run: bash ./mvnw --batch-mode verify

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: alfred
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pg -d alfred"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
