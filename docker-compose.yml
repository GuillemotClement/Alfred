services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pg}
      - POSTGRES_DB=${POSTGRES_DB:-alfred}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  adminer:
    image: adminer:6.2.0
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - ADMINER_DEFAULT_SERVER=db

volumes:
  postgres_data:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
