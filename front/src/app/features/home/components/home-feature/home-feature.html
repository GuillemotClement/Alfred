<div class="flex w-full items-center gap-5 rounded-2xl p-5 bg-white">

  <!-- /10 permet d'indiquer une transparence -->

    class="flex h-15 w-15 shrink-0 items-center justify-center bg-primary/10 text-primary rounded-2xl"
